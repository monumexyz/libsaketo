[package]
name = "saketo-ffi"
version = "0.1.0"
edition = "2024"
description = "FFI bindings for Saketo"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
zeroize = "1.8.2"
curve25519-dalek = "4.1.3"
rand = "0.9.2"
polyseed = { git = "https://github.com/monumexyz/monero-wallet-util" }
monero-seed = { git = "https://github.com/monumexyz/monero-wallet-util" }
monero-wallet = { git = "https://github.com/monumexyz/serai" }
monero-serai = { git = "https://github.com/monumexyz/serai" }