[package]
name = "monero_fastscan"
version = "0.1.0"
edition = "2024"
description = "A fast and async Monero wallet scanner library"

[dependencies]
tokio = { version = "1.47.1", features = ["macros"] }
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide" }
monero-simple-request-rpc = { git = "https://github.com/monero-oxide/monero-oxide" }
monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide" }
curve25519-dalek = "4.1.3"
zeroize = "1.8.1"
cuprate-epee-encoding = { git = "https://github.com/cuprate/cuprate" }
cuprate-types = { git = "https://github.com/cuprate/cuprate", features = ["epee"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde_json = "1.0.145"